name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache: true
          cache-dependency-path: go.sum

      - name: Go test
        run: go test ./... -count=1 -timeout 300s

      - name: Go build
        run: go build -o cloudreve

      - name: Go generate ent and verify clean tree
        run: go generate ./ent && git diff --exit-code
